[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-liquidity-sentinel"
version = "0.1.0"
description = "Liquidity Stress Index pipeline for the Russian money market (PSB Treasury)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ImPaul" }
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30",
    "altair>=5.0",
    "seaborn>=0.13",
]
models = [
    "shap>=0.44",
    "torch>=2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "shap>=0.44",
    "torch>=2.0",
]

[project.scripts]
ru-liquidity-sentinel = "ru_liquidity_sentinel.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

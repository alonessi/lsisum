[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-liquidity-sentinel"
version = "0.1.0"
description = "Incremental NSVM Liquidity Stress Index for the Russian money market."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ImPaul" }
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "torch>=2.0",
    "shap>=0.44",
    "streamlit>=1.30",
    "altair>=5.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "tenacity>=8.2",
    "python-dateutil>=2.9",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30",
    "altair>=5.0",
]
models = [
    "shap>=0.44",
    "torch>=2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "shap>=0.44",
    "torch>=2.0",
]

[project.scripts]
ru-liquidity-sentinel = "ru_liquidity_sentinel.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
